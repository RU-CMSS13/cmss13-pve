author: "chaos-creations"
delete-after: True
changes:
  - rscadd: "Game masters can give multitile vehicles an AI crew that drives, fights, reloads, swaps seats and bails out: Create Human AI > Vehicles, View Variables > Toggle AI Control, or the AI tank spawners."
  - rscadd: "AI vehicles without working guns drive away from their enemies and ram them only when cornered. AI vehicles other than tanks drive around obstacles instead of crushing them when they can."
  - rscadd: "AI vehicles shoot back at whoever shoots them from further away, turn their turret towards attackers they can't see yet and break through obstacles instead of looking for a way around. Friendly human AI steps aside for them."
  - rscadd: "AI vehicles don't ram friendly vehicles: a friendly AI vehicle in the way drives aside, others are waited for or driven around. Vehicles sent somewhere together get spots of their own and keep to the speed of the slowest one."
  - rscadd: "Vehicle AI crews bail out through the vehicle's doors instead of appearing outside."
  - rscadd: "Destroyed vehicles no longer stop bullets and can be pushed by walking into them or driving into them with anything heavier than a car."
  - rscadd: "Human AI can man M56D and M2C mounted guns."
  - rscadd: "Human AI medics heal wounded allies using their health analyzers."
  - bugfix: "Human AI sees guns spawned in its hands or kept in webbing and vests."
  - bugfix: "Human AI heals itself without overdosing."
  - bugfix: "Human AI holds fire when an ally stands right behind its target, and throws grenades only when it can't shoot."
  - bugfix: "Human AI shoots adjacent targets and no longer shoots at wrecked or empty vehicles."
  - bugfix: "Human AI hit by vehicle weapons shoots back at the vehicle instead of somewhere random."
  - bugfix: "Deleting a human AI while it fires no longer causes a runtime."
  - bugfix: "Detaching a variable zoom scope no longer leaves its zoom button behind on the gun."
  - bugfix: "The unarmed W-Y APC interior works and the Humvee interior no longer has two driver seats."
  - admin: "The Create Human AI panel has infantry, squad, vehicle and order tabs, MG nest and sniper spawning, and orders given by clicking with area selection."
  - admin: "The vehicles tab spawns squads of different vehicles in a column or a line, and lists the UPP vans and civilian vehicles."
  - admin: "Ctrl+click in command mode orders the selected AI to fire at the clicked thing or spot for 20 seconds."
  - admin: "AI vehicles keep their doors unlocked unless the game master locks them when spawning one."
  - admin: "Reworked the Human AI Management, Faction Management and Defense Creator panels. Fortify Room is now a Defense Creator tab with a preview."
  - rscdel: "Removed the Squad Spawner, Quick Order, patrol waypoint, machinegunner, sniper and Fortify Room verbs, their features are in the panels."
  - code_imp: "Human AI target scanning and action selection are cheaper."